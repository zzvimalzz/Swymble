<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0b0d">
<title>Oglets · Swymble Labs</title>
<meta name="description" content="An Oglet is a small creature made mostly of eyes, drawn from a weighted genome. You get one, it is yours, it watches you, and it remembers you — then read the alleles that made it.">

<meta property="og:title" content="Oglets · Swymble Labs">
<meta property="og:description" content="A small creature made mostly of eyes, drawn from a weighted genome. You get one, it is yours, and it watches you.">

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%230b0b0d'/><ellipse cx='11' cy='16' rx='7.4' ry='8' fill='%23f6f3ec'/><ellipse cx='23' cy='16' rx='5.6' ry='7' fill='%23f6f3ec'/><ellipse cx='12.4' cy='16' rx='2.6' ry='2.6' fill='%230b0b0d'/><ellipse cx='23.6' cy='16' rx='2.2' ry='2.2' fill='%230b0b0d'/></svg>">
<style>
  /* Two colours: ink and pearl. Every piece of chrome is one of them at some opacity, and the
     only real colour anywhere is the Oglet itself — which is the point of the whole page.
     Nothing sits below 62% pearl, because unreadable text is not "subtle", it is just missing. */
  :root{
    --ink:#0b0b0d;                       /* the page */
    --well:#070708;                      /* the canvas, and anything sunk into the page */
    --pearl:246 243 236;                 /* held as parts so opacity can vary per use */
    --txt:rgb(var(--pearl));
    --txt-2:rgb(var(--pearl) / .78);
    --txt-3:rgb(var(--pearl) / .64);
    --hair:rgb(var(--pearl) / .13);
    --hair-2:rgb(var(--pearl) / .3);
    --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0}
  body{background:var(--ink);color:var(--txt);font-family:var(--mono);font-size:13px;
       display:flex;flex-direction:column;overflow:hidden;
       -webkit-user-select:none;user-select:none;overscroll-behavior:none}
  ::selection{background:rgb(var(--pearl) / .22);color:var(--txt)}

  .tabs{flex:0 0 auto;display:flex;align-items:center;gap:2px;
        padding:10px 12px 0;border-bottom:1px solid var(--hair)}
  .tabs button{font:inherit;font-size:11px;letter-spacing:.2em;text-transform:uppercase;
        color:var(--txt-3);background:none;border:0;border-bottom:1px solid transparent;
        padding:8px 12px 9px;cursor:pointer;transition:color .2s,border-color .2s}
  .tabs button:hover{color:var(--txt-2)}
  .tabs button.on{color:var(--txt);border-bottom-color:var(--txt)}
  .tabs button:focus-visible{outline:1px solid var(--hair-2);outline-offset:2px;color:var(--txt)}
  .tabs .brand{margin-left:auto;color:var(--txt-3);letter-spacing:.24em;font-size:10px;
        text-transform:uppercase;padding-right:4px}

  .view{flex:1 1 auto;min-height:0;position:relative}
  .view[hidden]{display:none}

  /* world */
  #world{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
  body.grabbing #world{cursor:grabbing}
  #hint{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);
        font-size:11px;letter-spacing:.3em;color:var(--txt-2);text-transform:uppercase;
        pointer-events:none;opacity:0;transition:opacity 1.2s}

  /* genome */
  #genome{height:100%;overflow-y:auto;overscroll-behavior:contain;
          padding:16px 14px calc(40px + env(safe-area-inset-bottom));
          scrollbar-width:thin;scrollbar-color:rgb(var(--pearl) / .22) transparent}
  .roll{border:1px solid var(--hair);border-radius:4px;padding:14px;margin-bottom:22px;
        display:flex;gap:14px;align-items:center;background:var(--well)}
  .roll canvas{flex:0 0 auto;border-radius:3px;background:var(--well)}
  .roll .meta{flex:1 1 auto;min-width:0}
  .roll .code{font-size:17px;letter-spacing:.12em;color:var(--txt);margin-bottom:6px}
  .roll .odds{color:var(--txt-2);font-size:11px;line-height:1.75;letter-spacing:.03em}

  h2{font-size:10px;letter-spacing:.26em;text-transform:uppercase;color:var(--txt-2);
     font-weight:400;margin:26px 0 5px;display:flex;align-items:baseline;gap:8px}
  h2 span{color:var(--txt-3);letter-spacing:.05em;text-transform:none}
  h2:first-of-type{margin-top:0}

  /* 92px + 6px gap is what keeps four alleles on one row at 390px of usable width — bigger
     type made the old 88/8 spill a lone card onto a second line. */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px}
  .card{border:1px solid var(--hair);border-radius:3px;padding:9px 6px 8px;text-align:center;
        background:var(--well)}
  .card canvas{display:block;margin:0 auto 6px;border-radius:2px}
  .card .nm{font-size:11px;letter-spacing:.05em;color:var(--txt);
            white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card .rr{font-size:9px;letter-spacing:.1em;text-transform:uppercase;margin-top:4px;
            white-space:nowrap}   /* colour comes from the tier class below */
  .card .rr i{font-style:normal;letter-spacing:.08em;padding-left:.35em}
  .card .pc{font-size:10px;color:var(--txt-3);margin-top:3px;letter-spacing:.05em}
  /* Rarity is the one place colour is allowed back into the chrome — five steps of pearl
     brightness were not tellable apart at a glance. Every value below clears 8.8:1 on ink, and
     the pip count carries the same information for anyone who cannot separate the hues.
     The classes are doubled on purpose: `.card .rr` and `.roll .odds` are two-class selectors,
     so a single `.t2` would lose the specificity fight and every tier would render pearl. */
  .t0.t0{color:rgb(var(--pearl) / .72)}   /* Common — the absence of colour is itself the signal */
  .t1.t1{color:#6fdd9b}                   /* Uncommon */
  .t2.t2{color:#6fb6ff}                   /* Rare */
  .t3.t3{color:#c79bff}                   /* Epic */
  .t4.t4{color:#ffc95c}                   /* Legendary */
  .note{color:var(--txt-3);font-size:11px;line-height:1.85;letter-spacing:.04em;
        margin-top:28px;border-top:1px solid var(--hair);padding-top:16px}
</style>
</head>
<body>

<div class="tabs">
  <button id="tabWorld" class="on">World</button>
  <button id="tabGenome">Genome</button>
  <span class="brand">Oglets · Swymble Labs</span>
</div>

<div class="view" id="viewWorld">
  <canvas id="world"></canvas>
  <div id="hint">drag it</div>
</div>

<div class="view" id="viewGenome" hidden>
  <div id="genome"></div>
</div>

<script type="module">
import {
  GENES, TIERS, CATS, tierOf, geneOf, randomGenome, odds,
  encode, nameOf, packOglet, unpackOglet, STORAGE_KEY,
} from './genome.js';

/* The one colour value the canvas needs; everything else is CSS. Keep it equal to --well. */
const WELL="#070708";

(() => {
"use strict";
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t;
const smootherstep=t=>t*t*t*(t*(t*6-15)+10);
const rand=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const TAU=Math.PI*2;

class Spring{
  constructor(v,k=60){ this.v=v; this.vel=0; this.k=k; }
  to(t,dt,k=this.k){ const c=2*Math.sqrt(k),h=dt/4;
    for(let i=0;i<4;i++){ this.vel+=(k*(t-this.v)-c*this.vel)*h; this.v+=this.vel*h; }
    return this.v; }
}

/* colour helpers — needed for the Prism finish */
function hex2hsl(h){
  const r=parseInt(h.slice(1,3),16)/255,g=parseInt(h.slice(3,5),16)/255,b=parseInt(h.slice(5,7),16)/255;
  const mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2;
  let s=0,hu=0;
  if(mx!==mn){ const d=mx-mn; s=l>0.5?d/(2-mx-mn):d/(mx+mn);
    hu = mx===r?((g-b)/d+(g<b?6:0)) : mx===g?((b-r)/d+2) : ((r-g)/d+4); hu*=60; }
  return [hu,s,l];
}
function hsl(h,s,l){ return `hsl(${((h%360)+360)%360} ${(s*100).toFixed(1)}% ${(l*100).toFixed(1)}%)`; }
function shiftHue(hex,deg){ const [h,s,l]=hex2hsl(hex); return hsl(h+deg,s,l); }

/* The genome, the rarity tiers, the code and the name bank all live in ./genome.js —
   pure, deterministic and covered by the repo test suite. Everything below draws or moves. */

/* ═══════════════════════════════════════════════════════════
   EXPRESSIONS — the upper lid's inner and outer heights move
   independently. The gap between those two numbers is the emotion.
   ═══════════════════════════════════════════════════════════ */
const E={
  neutral:{li:.00,lo:.00,bi:.00,bo:.00,w:1.00,h:1.00,tilt:0},
  happy  :{li:.06,lo:.06,bi:.40,bo:.40,w:1.05,h:1.05,tilt:0},
  angry  :{li:.64,lo:.04,bi:.12,bo:.00,w:1.02,h:1.06,tilt:0},
  sad    :{li:.00,lo:.54,bi:.00,bo:.06,w:0.97,h:1.00,tilt:.05},
  sleepy :{li:.58,lo:.64,bi:.10,bo:.10,w:0.98,h:0.94,tilt:.03},
  asleep :{li:.14,lo:.16,bi:.08,bo:.08,w:0.96,h:0.92,tilt:.06},
};

const PHI=0.42, YAW=0.50, PITCH=0.34;
function eyeXform(m,yaw,pitch){
  const ca=Math.cos(yaw),sa=Math.sin(yaw);
  const n0x=m*Math.sin(PHI), n0z=Math.cos(PHI);
  const nx=n0x*ca+n0z*sa; let nz=-n0x*sa+n0z*ca;
  const cb=Math.cos(pitch),sb=Math.sin(pitch);
  const ny=nz*sb; nz=nz*cb;
  return {nx,ny,nz,fx:Math.sqrt(Math.max(0,1-nx*nx)),fy:Math.sqrt(Math.max(0,1-ny*ny))};
}

/* ═══════════════════════════════════════════════════════════
   BODY — genome + expression + gaze + blink, no world knowledge.
   The world uses it; so do the little catalogue thumbnails.
   ═══════════════════════════════════════════════════════════ */
class Body{
  constructor(g){
    this.g=g;
    this.shape=geneOf("shape",g.shape);
    this.pup=geneOf("pupil",g.pupil);
    this.pal=geneOf("palette",g.palette);
    this.fin=geneOf("finish",g.finish);

    this.S={gx:0,gy:0,tx:0,ty:0,li:0,lo:0,bi:0,bo:0,w:1,h:1,tilt:0,
            blinkL:0,blinkR:0,pop:0,sleep:0};
    this.sp={x:new Spring(0,66),y:new Spring(0,66),
             li:new Spring(0,54),lo:new Spring(0,54),
             bi:new Spring(0,54),bo:new Spring(0,54),
             w:new Spring(1,54),h:new Spring(1,54),tilt:new Spring(0,42),
             sleep:new Spring(0,20)};
    this.blk={t:1e9,dur:.3,next:rand(1,5),q:0,eye:0};
    this.sac={on:false,t:0,dur:0,fx:0,fy:0,tx:0,ty:0};
    this.expr="neutral"; this.exprUntil=0; this.asleep=false; this.drowsy=false;
  }
  setExpr(n,s,now){ this.expr=n; this.exprUntil=now+s; }
  blinkNow(d=0){ this.blk.next=Math.min(this.blk.next,d); }
  wink(){ this.blk.eye=Math.random()<0.5?-1:1; this.blk.t=1e9; this.blinkNow(0); }
  glance(tx,ty){
    const s=this.sac,amp=Math.hypot(tx-this.S.gx,ty-this.S.gy);
    s.on=true;s.t=0;s.dur=clamp(0.15+amp*0.22,0.16,0.44);
    s.fx=this.S.gx;s.fy=this.S.gy;s.tx=tx;s.ty=ty;
  }
  updateBlink(dt){
    const b=this.blk,S=this.S;
    if(this.asleep){ S.blinkL=S.blinkR=0; b.t=1e9; b.next=rand(2,5); return; }
    b.next-=dt;
    if(b.next<=0&&b.t>b.dur){
      b.t=0; b.dur=this.drowsy?rand(0.5,0.8):rand(0.26,0.34);
      if(b.q>0){ b.q--; b.next=b.dur+0.1; }
      else{ b.q=Math.random()<0.09?1:0;
            b.next=b.q?b.dur+0.1:(this.drowsy?rand(3,6):rand(4.5,10))/this.g.pace; }
    }
    b.t+=dt;
    const q=b.t/b.dur;
    const v=q>=1?0:(q<0.36?smootherstep(q/0.36):1-smootherstep(clamp((q-0.40)/0.60,0,1)));
    S.blinkL=b.eye===1?0:v; S.blinkR=b.eye===-1?0:v;
    if(q>=1) b.eye=0;
  }
  poke(){ this.S.pop=1; this.blinkNow(0.05); }
  update(dt,now){
    const S=this.S;
    this.updateBlink(dt);
    const s=this.sac;
    if(s.on){
      s.t+=dt; const q=clamp(s.t/s.dur,0,1),e=smootherstep(q);
      S.gx=lerp(s.fx,s.tx,e); S.gy=lerp(s.fy,s.ty,e);
      this.sp.x.v=S.gx; this.sp.y.v=S.gy; this.sp.x.vel=this.sp.y.vel=0;
      if(q>=1) s.on=false;
    } else { S.gx=this.sp.x.to(S.tx,dt); S.gy=this.sp.y.to(S.ty,dt); }

    const X=E[this.expr],pop=S.pop;
    S.li=this.sp.li.to(X.li*(1-pop*.9),dt); S.lo=this.sp.lo.to(X.lo*(1-pop*.9),dt);
    S.bi=this.sp.bi.to(X.bi*(1-pop*.9),dt); S.bo=this.sp.bo.to(X.bo*(1-pop*.9),dt);
    S.w=this.sp.w.to(X.w+pop*.14,dt); S.h=this.sp.h.to(X.h+pop*.22,dt);
    S.tilt=this.sp.tilt.to(X.tilt,dt);
    S.sleep=this.sp.sleep.to(this.asleep?1:0,dt);
    S.pop=Math.max(0,S.pop-dt*2.2);
  }

  /* ── colours, with Prism cycling and Glow haloing ── */
  cols(t){
    const f=this.fin.id;
    if(f==="prism"){ const d=t*26;
      return {e:shiftHue(this.pal.e,d), p:shiftHue(this.pal.p,d+40)}; }
    return {e:this.pal.e,p:this.pal.p};
  }

  /* ═════ PEEPER ═════ */
  eyePath(ctx,rx,ry,m,top){
    const s=this.shape;
    const A={x:0,y:-ry*(1+top)},B={x:rx*m,y:0},C={x:0,y:ry},D={x:-rx*m,y:0};
    const kT=s.kT+top*0.2,kI=s.kI+top*0.2;
    ctx.beginPath(); ctx.moveTo(A.x,A.y);
    ctx.bezierCurveTo(A.x+(B.x-A.x)*kT,A.y, B.x,B.y+(A.y-B.y)*kT, B.x,B.y);
    ctx.bezierCurveTo(B.x,B.y+(C.y-B.y)*s.kO, B.x+(C.x-B.x)*s.kO,C.y, C.x,C.y);
    ctx.bezierCurveTo(C.x+(D.x-C.x)*s.kB,C.y, D.x,D.y+(C.y-D.y)*s.kB, D.x,D.y);
    ctx.bezierCurveTo(D.x,D.y+(A.y-D.y)*kI, D.x+(A.x-D.x)*kI,A.y, A.x,A.y);
    ctx.closePath();
  }
  lid(ctx,rx,ry,m,a,bv,upper){
    const xi=-2.4*rx*m,xo=2.4*rx*m,sg=upper?1:-1;
    const base=upper?-ry*1.25:ry*1.25;
    const yi=base+sg*a*(2.5*ry),yo=base+sg*bv*(2.5*ry);
    const cy=(yi+yo)/2+(upper?ry*0.10*Math.max(a,bv):-ry*0.90*Math.max(a,bv));
    ctx.beginPath(); ctx.moveTo(xi*40,yi); ctx.lineTo(xi,yi);
    ctx.quadraticCurveTo(0,cy,xo,yo);
    ctx.lineTo(xo*40,yo); ctx.lineTo(xo*40,sg*ry*80); ctx.lineTo(xi*40,sg*ry*80);
    ctx.closePath();
  }
  pupil(ctx,rx,ry,px,py,c){
    const r=rx*this.g.pupilSize, k=this.pup.id;
    ctx.fillStyle=c.p; ctx.beginPath();
    if(k==="dot")       ctx.ellipse(px,py,r,r,0,0,TAU);
    else if(k==="oval") ctx.ellipse(px,py,rx*0.46,ry*0.80,0,0,TAU);
    else if(k==="slit") ctx.ellipse(px,py,rx*0.15,ry*0.62,0,0,TAU);
    else                ctx.ellipse(px,py,r*1.3,r*1.3,0,0,TAU);
    ctx.fill();
    if(k==="ring"){ ctx.fillStyle=c.e; ctx.beginPath();
      ctx.ellipse(px,py,r*0.56,r*0.56,0,0,TAU); ctx.fill(); }
  }
  drawEye(ctx,x,y,rx,ry,m,px,py,top,cl,c){
    const S=this.S;
    ctx.save(); ctx.translate(x,y);
    const li=clamp(S.li+cl*(1-S.li),0,1), lo=clamp(S.lo+cl*(1-S.lo),0,1);
    const shut=clamp((cl-0.78)/0.22,0,1);
    if(shut<0.999){
      ctx.save(); ctx.globalAlpha=1-shut;
      this.eyePath(ctx,rx,ry,m,top); ctx.clip();
      if(li>.002||lo>.002){ this.lid(ctx,rx,ry,m,li,lo,true); ctx.clip(); }
      if(S.bi>.002||S.bo>.002){ this.lid(ctx,rx,ry,m,S.bi,S.bo,false); ctx.clip(); }
      ctx.fillStyle=c.e; ctx.fillRect(-rx*3,-ry*3,rx*6,ry*6);
      this.pupil(ctx,rx,ry,px*rx,py*ry,c);
      ctx.restore();
    }
    if(shut>0.004){
      ctx.globalAlpha=shut; ctx.strokeStyle=c.e;
      ctx.lineWidth=ry*0.20; ctx.lineCap="round";
      ctx.beginPath(); ctx.moveTo(-rx*0.78,ry*0.10);
      ctx.quadraticCurveTo(0,ry*0.10+ry*0.44,rx*0.78,ry*0.10);
      ctx.stroke(); ctx.globalAlpha=1;
    }
    ctx.restore();
  }
  drawPeeper(ctx,R,t,c){
    const S=this.S,g=this.g;
    const half=R*g.gap, Rh=half/Math.sin(PHI);
    const yaw=S.gx*YAW, pitch=S.gy*PITCH;
    const lift=-Math.min(S.bi,S.bo)*1.05*this.pup.lift
               +Math.min(S.li,S.lo)*0.85*this.pup.lift;
    for(const m of [-1,1]){
      const q=eyeXform(m,yaw,pitch);
      const persp=3.2/(3.2+(1-q.nz));
      const turn=clamp(1-q.fx/Math.cos(PHI),0,0.42);
      const sx=clamp(q.fx/Math.cos(PHI),0.45,1.06)*persp;
      const sy=q.fy*(1+turn*0.28)*persp;
      const aw=m<0?g.asymW:2-g.asymW, ah=m<0?g.asymH:2-g.asymH;
      const cl=Math.max(m<0?S.blinkL:S.blinkR,S.sleep);
      this.drawEye(ctx,q.nx*Rh*persp,q.ny*Rh*persp,
        R*this.shape.rx*S.w*sx*aw, R*this.shape.ry*S.h*sy*ah, m,
        clamp(S.gx*this.pup.travel-0.06*m,-0.62,0.62),
        clamp(S.gy*this.pup.travel*0.74+lift,-0.85,0.85),
        turn*0.30, cl, c);
    }
  }

  draw(ctx,R,t){
    const c=this.cols(t);
    if(this.fin.id==="glow"){ ctx.shadowColor=c.e; ctx.shadowBlur=R*0.55; }
    this.drawPeeper(ctx,R,t,c);
    ctx.shadowBlur=0;
  }
  get radius(){
    // conservative personal space, measured from the drawn geometry
    const S=this.S,g=this.g;
    const half=g.gap, Rh=half/Math.sin(PHI);
    let ex=0,ey=0;
    for(const m of [-1,1]){
      const q=eyeXform(m,S.gx*YAW,S.gy*PITCH);
      const persp=3.2/(3.2+(1-q.nz));
      const turn=clamp(1-q.fx/Math.cos(PHI),0,0.42);
      const sx=clamp(q.fx/Math.cos(PHI),0.45,1.06)*persp;
      const sy=q.fy*(1+turn*0.28)*persp;
      ex=Math.max(ex,Math.abs(q.nx*Rh*persp)+this.shape.rx*S.w*sx*g.asymW);
      ey=Math.max(ey,Math.abs(q.ny*Rh*persp)+this.shape.ry*S.h*sy*g.asymH*(1+turn*0.30));
    }
    return Math.max(ex,ey)*1.06;
  }
}

/* ═══════════════════════════════════════════════════════════
   WORLD
   ═══════════════════════════════════════════════════════════ */
class Oglet{
  constructor(g,scale,seat){
    this.body=new Body(g); this.g=g; this.scale=scale; this.seat=seat;
    this.b={x:seat.x,y:seat.y,vx:0,vy:0,tx:seat.x,ty:seat.y,nextDrift:0,
            z:1,vz:0,shake:0};
    /* drives — every expression this Oglet ever wears is traced back to one of these, so nothing
       it feels is arbitrary. annoy: being mashed. held: a hand resting on it. bond: how attached
       it is to you. cheer: good things banked, spent on a smile. ignored: seconds you have been
       on the page without coming near. lonely: only ever built from being ignored. */
    this.drive={annoy:0,idle:rand(0,6),held:0,bond:0,cheer:0,ignored:0,lonely:0};
    this.phase="awake"; this.phaseAt=0; this.wakeAt=0; this.yawned=false;
    this.sleepAfter=rand(18,32); this.napFor=rand(16,34);
    /* what it does when it is on its own: track something imaginary, daydream, or look for you */
    this.solo={mote:null};
    this.nextWander=0; this.attn="wander"; this.attnUntil=0; this.peer=null;
    this.dragging=false; this.gdx=0; this.gdy=0; this.taps=[];
    this.soc={state:"none",partner:null,until:0,role:null,
              nextTry:rand(3,9),bumped:false,nextEmote:0};
    this.pending=null; this.zzz=[]; this.nextZ=0;
    this._rad=Math.min(W,H)*scale*2.1;
  }
  get R(){ return Math.min(W,H)*this.scale; }
  get rad(){ return this._rad; }
  get cx(){ return W/2+this.b.x; }
  get cy(){ return H/2+this.b.y; }
  hit(x,y){ return Math.hypot(x-this.cx,y-this.cy)<this._rad; }
  setExpr(n,s,now){ this.body.setExpr(n,s,now); }
  aimAt(p){ return {x:clamp((p.x-this.cx)/(Math.min(W,H)*0.34),-1,1),
                    y:clamp((p.y-this.cy)/(Math.min(W,H)*0.34),-1,1)}; }
  wake(now,startled){
    if(this.phase==="awake") return;
    this.phase="awake"; this.phaseAt=now; this.drive.idle=0; this.yawned=false;
    this.body.asleep=false; this.body.drowsy=false;
    this.body.S.pop=startled?1:0.55; this.body.blinkNow(startled?0.32:0.2);
    if(!startled) this.setExpr("happy",1.4,now);
  }
  emote(e,now,d=1.6){ this.setExpr(e,d,now);
    const p=this.soc.partner; if(p&&p.phase==="awake") p.receive(e,this,now); }
  receive(e,from,now){
    let r=e;
    if(e==="sad")   r=this.g.temper>1.15?"happy":"sad";
    if(e==="angry") r=this.g.temper>1.05?"angry":"sad";
    this.pending={expr:r,at:now+rand(0.35,0.8),dur:rand(1.2,2.0)};
    this.attn="peer"; this.peer=from; this.attnUntil=now+rand(1.5,3);
  }
  startle(who,now){
    if(this.phase!=="awake") this.wake(now,true);
    this.attn="peer"; this.peer=who; this.attnUntil=now+rand(1.2,2.6);
    if(Math.random()<0.35) this.body.blinkNow(0.1);
  }
  endSocial(now){
    const p=this.soc.partner;
    this.soc.state="none"; this.soc.partner=null; this.soc.role=null;
    this.soc.bumped=false; this.soc.nextTry=now+rand(6,16)/this.g.sociable;
    if(p&&p.soc.partner===this){ p.soc.state="none"; p.soc.partner=null;
      p.soc.role=null; p.soc.bumped=false; p.soc.nextTry=now+rand(6,16)/p.g.sociable; }
  }
  bump(o,now){
    const dx=o.b.x-this.b.x,dy=o.b.y-this.b.y,n=Math.max(Math.hypot(dx,dy),1);
    this.b.vx-=(dx/n)*250; this.b.vy-=(dy/n)*250;
    o.b.vx+=(dx/n)*250; o.b.vy+=(dy/n)*250;
    this.body.poke(); o.body.poke();
    this.setExpr("happy",1.6,now); o.setExpr("happy",1.6,now);
  }
  poke(now){
    const dx=this.cx-ptr.x,dy=this.cy-ptr.y,n=Math.max(Math.hypot(dx,dy),1);
    this.b.vx+=(dx/n)*430; this.b.vy+=(dy/n)*430; this.b.vz-=5;
    this.body.poke();
    this.taps.push(now); this.taps=this.taps.filter(t=>now-t<3);
    this.drive.annoy=clamp(this.drive.annoy+(0.17+this.taps.length*0.06)*this.g.temper,0,1.3);
    this.drive.ignored=0;
    if(this.drive.annoy>0.5){ this.setExpr("angry",2.2,now); this.b.shake=1;
      const p=this.soc.partner; if(p) p.receive("angry",this,now); }
    else if(this.drive.annoy>0.28) this.setExpr("sad",1.2,now);
    // one poke, on its own, is a hello rather than a jab — mashing is what earns the scowl above
    else if(this.taps.length===1){ this.drive.cheer=clamp(this.drive.cheer+0.85,0,2);
      this.drive.lonely=Math.max(0,this.drive.lonely-0.4); }
    for(const o of world) if(o!==this&&Math.random()<0.7) o.startle(this,now);
  }
  updateSocial(dt,now){
    const s=this.soc, B=this.body;
    if(this.phase!=="awake"||this.dragging){ if(s.state!=="none") this.endSocial(now); return; }
    if(s.state==="none"){
      if(now>s.nextTry){
        const c=world.filter(o=>o!==this&&o.phase==="awake"&&o.soc.state==="none"&&!o.dragging);
        if(c.length){
          const p=pick(c);
          s.state="approach"; s.partner=p; s.until=now+rand(7,13);
          p.soc.state="approach"; p.soc.partner=this; p.soc.until=s.until;
          this.attn="peer"; this.peer=p; p.attn="peer"; p.peer=this;
          this.attnUntil=p.attnUntil=now+30;
          const t=this.aimAt({x:p.cx,y:p.cy}); B.glance(t.x,t.y);
        } else s.nextTry=now+rand(3,7);
      }
      return;
    }
    const p=s.partner;
    if(!p||p.soc.partner!==this){ this.endSocial(now); return; }
    const dist=Math.hypot(p.b.x-this.b.x,p.b.y-this.b.y), touch=this._rad+p._rad;
    if(s.state==="approach"){
      if(dist<touch*1.3){ s.state="engage"; s.until=now+rand(3,6); s.nextEmote=now+rand(.2,.7);
        p.soc.state="engage"; p.soc.until=s.until; }
      else if(now>s.until) this.endSocial(now);
    } else if(s.state==="engage"){
      if(now>s.nextEmote){
        s.nextEmote=now+rand(1.8,3.2);
        const e=this.drive.annoy>0.45?"angry":(Math.random()<0.68?"happy":"sad");
        this.emote(e,now,rand(1.4,2.2));
        if(e==="happy"&&Math.random()<0.3) B.wink();
      }
      if(!s.bumped&&dist<touch*1.1&&Math.random()<dt*1.2){ s.bumped=true; this.bump(p,now); }
      if(now>s.until){
        if(Math.random()<0.45&&this.body.expr!=="angry"&&p.body.expr!=="angry"){
          s.state="play"; s.role="chase"; s.until=now+rand(5,9);
          p.soc.state="play"; p.soc.role="run"; p.soc.until=s.until;
          this.setExpr("happy",2,now); p.setExpr("happy",2,now);
        } else this.endSocial(now);
      }
    } else if(s.state==="play"){
      if(dist<touch*1.12&&Math.random()<dt*3){
        this.bump(p,now);
        s.role=s.role==="chase"?"run":"chase";
        p.soc.role=p.soc.role==="chase"?"run":"chase";
      }
      if(Math.random()<dt*0.5) this.setExpr("happy",1.5,now);
      if(now>s.until) this.endSocial(now);
    }
  }
  update(dt,now){
    const b=this.b,d=this.drive,B=this.body;
    d.idle+=dt; d.annoy=Math.max(0,d.annoy-dt*(d.held>0.8?0.02:0.09));
    if(this.pending&&now>=this.pending.at){
      this.setExpr(this.pending.expr,this.pending.dur,now); this.pending=null; }

    const reach=Math.hypot(ptr.x-this.cx,ptr.y-this.cy);
    const near=reach<this._rad*1.25, close=reach<this._rad*2.8;
    const att=ptr.in&&(now-ptr.last)<3.2;
    if(att) d.idle=0;
    if(ptr.down&&near&&ptr.moved<this.R*0.5){
      d.held+=dt; if(d.held>0.5&&d.annoy<0.45) d.annoy=Math.max(0,d.annoy-dt*0.35);
    } else d.held=Math.max(0,d.held-dt*2);

    /* ── how it feels about you, updated once per frame ──
       Being on its own is not sad: an Oglet alone in an empty room entertains itself quite happily.
       What actually stings is you being *here* and not coming near — so loneliness is built from
       `ignored`, never from a plain absence of company. */
    const alone=world.length<2;
    if(this.phase==="awake"&&!this.dragging){
      if(d.held>0.35){ d.bond=clamp(d.bond+dt*0.05,0,1); d.cheer=clamp(d.cheer+dt*0.5,0,2); d.ignored=0; }
      else if(att&&close){ d.bond=clamp(d.bond+dt*0.012,0,1); d.cheer=clamp(d.cheer+dt*0.16,0,2); d.ignored=0; }
      else if(att&&alone){ d.ignored+=dt; }
      else d.ignored=Math.max(0,d.ignored-dt*0.5);

      if(d.annoy>0.6) d.bond=Math.max(0,d.bond-dt*0.04);
      if(this.attn==="user"&&d.ignored>18) d.lonely=clamp(d.lonely+dt*0.06,0,1);
      else if(d.ignored<1) d.lonely=Math.max(0,d.lonely-dt*0.35);
      d.cheer=Math.max(0,d.cheer-dt*0.05);   // an unspent good mood fades rather than banking up
    }

    if(this.phase==="awake"){
      if(d.idle>this.sleepAfter&&this.soc.state==="none"){
        this.phase="sleepy"; this.phaseAt=now; this.yawned=false; B.drowsy=true; }
    } else if(this.phase==="sleepy"){
      if(!this.yawned&&now-this.phaseAt>1.2){ this.yawned=true; B.blinkNow(0); B.blk.dur=0.9;
        for(const o of world) if(o!==this&&o.phase==="awake"&&Math.random()<0.5)
          o.drive.idle+=rand(4,9); }
      if(now-this.phaseAt>8){ this.phase="asleep"; this.phaseAt=now; B.asleep=true;
        this.wakeAt=now+this.napFor; this.nextZ=now+0.8;
        b.ty=this.seat.y+Math.min(W,H)*0.04; }
      if(d.idle<1.5) this.wake(now,false);
    } else if(this.phase==="asleep"){
      if(now>this.wakeAt||d.idle<1.5) this.wake(now,d.idle<1.5);
    }

    if(this.phase==="asleep"&&now>this.nextZ){
      this.nextZ=now+rand(1.4,2.1);
      this.zzz.push({t:0,life:rand(2.8,3.6),ph:rand(0,TAU)});
    }
    for(let i=this.zzz.length-1;i>=0;i--){
      this.zzz[i].t+=dt; if(this.zzz[i].t>this.zzz[i].life) this.zzz.splice(i,1); }

    this.updateSocial(dt,now);

    /* ── the face ──
       Every branch here names the thing that caused it. Nothing is picked at random: an Oglet that
       looks sad is sad *about* something, which is the whole difference between a character and
       a screensaver. */
    if(now>B.exprUntil){
      if(this.phase==="asleep")        B.expr="asleep";
      else if(this.phase==="sleepy")   B.expr="sleepy";
      else if(d.annoy>0.5)             B.expr="angry";   // you kept jabbing it
      else if(d.held>0.6)              B.expr="happy";   // your hand is resting on it
      else if(this.soc.state==="play") B.expr="happy";   // mid-game with a friend
      else{
        B.expr="neutral";
        if(d.cheer>=1){                                   // something good just happened — spend it
          d.cheer=0; this.setExpr("happy",rand(1.4,2.4),now);
          if(Math.random()<0.28) B.wink();
        } else if(d.lonely>0.55&&!this.dragging){         // you are right there, and not looking
          d.lonely=Math.max(0,d.lonely-0.3);
          this.setExpr("sad",rand(1.6,2.6),now); B.blinkNow(0.2);
        }
      }
    }

    /* ── what it is paying attention to ──
       With company, the old peer/user/wander mix. On its own, it does not just stare into space:
       it tracks something imaginary, daydreams, or goes looking for you. */
    const social=this.soc.state!=="none";
    if(!social&&now>this.attnUntil&&this.phase==="awake"){
      const peers=world.filter(x=>x!==this);
      const r=Math.random();
      if(att){
        const watch=clamp(0.55+d.bond*0.3,0,0.92);        // the fonder it is, the more it watches
        this.attn=r<watch?"user":(peers.length&&r<watch+0.22?"peer":"wander");
        this.attnUntil=now+rand(2.2,5.5);
      } else if(peers.length){
        this.attn=r<0.5?"peer":"wander";
        this.attnUntil=now+rand(2,5.5);
      } else if(ptr.seen&&(d.lonely>0.35||d.ignored>6)){
        this.attn="seek";                                  // checks the last place you were
        this.attnUntil=now+rand(3,6);
        const t=this.aimAt({x:ptr.x,y:ptr.y}); B.glance(t.x,t.y);
      } else if(r<0.42){
        this.attn="mote";                                  // follows a speck only it can see
        this.attnUntil=now+rand(4.5,9);
        this.solo.mote={a:rand(0,TAU),r:rand(0.35,0.85),ph:rand(0,TAU),
                        sp:rand(0.3,0.62)*(Math.random()<0.5?-1:1)};
      } else if(r<0.72){
        this.attn="muse";                                  // looks up, thinking about nothing
        this.attnUntil=now+rand(3.5,7);
        B.glance(rand(-0.3,0.3),rand(-0.78,-0.42));
      } else {
        this.attn="wander";
        this.attnUntil=now+rand(2,5);
      }
      if(this.attn==="peer"){ this.peer=peers.length?pick(peers):null; if(!this.peer) this.attn="wander"; }
    }
    if(social){ this.attn="peer"; this.peer=this.soc.partner; }

    const S=B.S;
    if(this.phase==="asleep"){ S.tx=0; S.ty=0.2; }
    else if(this.dragging){ S.tx=clamp(b.vx*0.0016,-.9,.9); S.ty=clamp(b.vy*0.0014,-.7,.7); }
    else if(this.attn==="user"&&att){ const t=this.aimAt({x:ptr.x,y:ptr.y}); S.tx=t.x; S.ty=t.y; }
    else if(this.attn==="peer"&&this.peer){ const t=this.aimAt({x:this.peer.cx,y:this.peer.cy}); S.tx=t.x; S.ty=t.y; }
    else if(this.attn==="mote"&&this.solo.mote){
      const mo=this.solo.mote; mo.a+=dt*mo.sp;             // a slow, smooth arc — a fly, basically
      S.tx=Math.cos(mo.a)*mo.r; S.ty=Math.sin(mo.a*0.7+mo.ph)*mo.r*0.55;
    }
    else if(this.attn==="seek"&&ptr.seen){ const t=this.aimAt({x:ptr.x,y:ptr.y}); S.tx=t.x; S.ty=t.y; }
    else if(this.attn==="muse"){ /* holds the glance set when it started daydreaming */ }
    else if(now>this.nextWander){
      this.nextWander=now+(Math.random()<0.34?rand(3,6.5):rand(1.3,2.8))/this.g.pace;
      if(Math.random()<0.24){ S.tx=0; S.ty=0; }
      else{ const a=rand(0,TAU),r=Math.pow(Math.random(),0.45);
            S.tx=Math.cos(a)*r; S.ty=Math.sin(a)*r*0.6; }
      B.glance(S.tx,S.ty);
    }

    const limX=W/2-this._rad, limY=H/2-this._rad;
    if(this.dragging){
      const tx=clamp(ptr.x-W/2+this.gdx,-limX,limX), ty=clamp(ptr.y-H/2+this.gdy,-limY,limY);
      b.vx+=(150*(tx-b.x)-19*b.vx)*dt; b.vy+=(150*(ty-b.y)-19*b.vy)*dt;
      if(Math.hypot(b.vx,b.vy)>1500) d.annoy=Math.min(1.2,d.annoy+dt*0.3*this.g.temper);
    } else {
      const s=this.soc,p=s.partner; let tx,ty;
      if(p&&(s.state==="approach"||s.state==="engage")){
        const dx=b.x-p.b.x,dy=b.y-p.b.y,n=Math.max(Math.hypot(dx,dy),1);
        const want=(this._rad+p._rad)*1.06;
        tx=p.b.x+(dx/n)*want; ty=p.b.y+(dy/n)*want*0.6;
      } else if(p&&s.state==="play"){
        const dx=b.x-p.b.x,dy=b.y-p.b.y,n=Math.max(Math.hypot(dx,dy),1);
        const touch=(this._rad+p._rad)*1.04;
        if(s.role==="chase"){ tx=p.b.x+(dx/n)*touch; ty=p.b.y+(dy/n)*touch; }
        else{ tx=p.b.x+(dx/n)*touch*2.6; ty=p.b.y+(dy/n)*touch*2.6; }
      } else {
        if(now>b.nextDrift){
          b.nextDrift=now+(this.phase==="asleep"?rand(6,11):rand(3,7.5)/this.g.pace);
          const rad=Math.min(W,H)*(this.phase==="asleep"?0.03:0.14);
          const a=rand(0,TAU),r=Math.sqrt(Math.random())*rad;
          b.tx=this.seat.x+Math.cos(a)*r; b.ty=this.seat.y+Math.sin(a)*r*0.8;
        }
        tx=b.tx; ty=b.ty;
        if(att&&this.phase==="awake"&&this.attn==="user"){
          // leans in when it likes you, backs off when it has had enough of you
          const pull=d.annoy>0.5?-0.10:0.09+d.bond*0.07;
          tx+=(ptr.x-W/2-b.x)*pull; ty+=(ptr.y-H/2-b.y)*pull;
        } else if(this.phase==="awake"&&this.attn==="seek"&&ptr.seen){
          tx+=(ptr.x-W/2-b.x)*0.05; ty+=(ptr.y-H/2-b.y)*0.05;   // wanders over to where you were
        }
      }
      const chase=this.soc.state==="play"&&this.soc.role==="chase";
      const k=this.phase==="asleep"?2.4:(chase?9:5.5)*this.g.pace;
      const c=this.phase==="asleep"?3.2:3.7;
      b.vx+=(k*(clamp(tx,-limX,limX)-b.x)-c*b.vx)*dt;
      b.vy+=(k*(clamp(ty,-limY,limY)-b.y)-c*b.vy)*dt;
    }
    b.x+=b.vx*dt; b.y+=b.vy*dt;
    b.vz+=(34*(1-b.z)-8.2*b.vz)*dt; b.z+=b.vz*dt;
    b.shake=Math.max(0,b.shake-dt*0.8);

    B.update(dt,now);
    this._rad=Math.max(B.radius*this.R*Math.abs(b.z), this._rad*0.985);
  }
  draw(ctx,t){
    const b=this.b,B=this.body,R=this.R;
    const sleeping=this.phase==="asleep";
    const breathe=1+Math.sin(t*(sleeping?0.5:1)*this.g.pace)*(sleeping?0.034:0.011);
    const shake=b.shake>0?Math.sin(t*26)*b.shake*R*0.05:0;
    const lean=clamp(b.vx*0.00018,-0.1,0.1);
    ctx.save();
    ctx.translate(this.cx+shake,this.cy);
    ctx.rotate(B.S.tilt+lean);
    ctx.scale(b.z*breathe,b.z*breathe);
    B.draw(ctx,R,t);
    ctx.restore();
  }
  drawZzz(ctx){
    if(!this.zzz.length) return;
    const hr=this._rad;
    ctx.textAlign="center"; ctx.textBaseline="middle";
    for(const z of this.zzz){
      const p=z.t/z.life, size=hr*(0.24+p*0.30);
      const x=this.cx+hr*0.62+Math.sin(p*3.4+z.ph)*hr*0.20;
      const y=this.cy-hr*0.72-p*hr*1.45;
      ctx.globalAlpha=Math.sin(p*Math.PI)*0.7;
      ctx.fillStyle=this.body.pal.e;
      ctx.font=`600 ${size.toFixed(1)}px ui-monospace,Menlo,monospace`;
      ctx.fillText("z",x,y);
    }
    ctx.globalAlpha=1;
  }
}

function separate(){
  for(let it=0;it<6;it++){
    for(let i=0;i<world.length;i++) for(let j=i+1;j<world.length;j++){
      const A=world[i],B=world[j];
      let dx=B.b.x-A.b.x,dy=B.b.y-A.b.y,dist=Math.hypot(dx,dy);
      if(dist<0.0001){ dx=rand(-1,1); dy=rand(-1,1); dist=Math.hypot(dx,dy); }
      const need=A._rad+B._rad;
      if(dist>=need) continue;
      const nx=dx/dist,ny=dy/dist,push=need-dist;
      const imA=A.dragging?0:1/(A._rad*A._rad), imB=B.dragging?0:1/(B._rad*B._rad);
      const tot=(imA+imB)||1;
      A.b.x-=nx*push*(imA/tot); A.b.y-=ny*push*(imA/tot);
      B.b.x+=nx*push*(imB/tot); B.b.y+=ny*push*(imB/tot);
      const rel=(B.b.vx-A.b.vx)*nx+(B.b.vy-A.b.vy)*ny;
      if(rel<0){ const jj=-rel*0.6;
        A.b.vx-=nx*jj*(imA/tot); A.b.vy-=ny*jj*(imA/tot);
        B.b.vx+=nx*jj*(imB/tot); B.b.vy+=ny*jj*(imB/tot); }
    }
  }
  for(const c of world){
    const lx=W/2-c._rad, ly=H/2-c._rad;
    if(Math.abs(c.b.x)>lx){ c.b.x=clamp(c.b.x,-lx,lx); c.b.vx*=-0.36; }
    if(Math.abs(c.b.y)>ly){ c.b.y=clamp(c.b.y,-ly,ly); c.b.vy*=-0.36; }
  }
}

/* ── canvas + input ── */
const cv=document.getElementById("world"), ctx=cv.getContext("2d");
let W=0,H=0;
function resize(){
  const dp=Math.min(devicePixelRatio||1,2.5);
  const r=cv.getBoundingClientRect();
  W=r.width||innerWidth; H=r.height||innerHeight;
  cv.width=W*dp; cv.height=H*dp; ctx.setTransform(dp,0,0,dp,0,0);
}
addEventListener("resize",()=>{ resize(); });
resize();

/* ═══════════════════════════════════════════════════════════
   YOURS
   One Oglet, rolled the first time you ever open the page and kept in this browser afterwards.
   What is stored is the nine-character code, not the genome: it is the same string the Genome
   tab shows you, so the format on screen and the format on disk can never drift apart. If the
   store is empty, unreadable, or holds a code that no longer decodes, a new one hatches.
   ═══════════════════════════════════════════════════════════ */
const store={
  read(){ try{ return unpackOglet(localStorage.getItem(STORAGE_KEY)); }catch{ return null; } },
  write(s){ try{ localStorage.setItem(STORAGE_KEY,packOglet(s)); }catch{} },
};
function hatch(){
  const genome=randomGenome(), code=encode(genome), at=Date.now();
  return {code,genome,name:nameOf(code),bond:0,born:at,seen:at};
}
const saved=store.read();
const mine=saved??hatch();
const firstMeeting=!saved;
/* How long you have been gone decides how it greets you: a few minutes and it is simply pleased,
   half a day and it had given up and gone to sleep. */
const awayFor=firstMeeting?0:Math.max(0,Date.now()-mine.seen);
if(firstMeeting) store.write(mine);

const world=[ new Oglet(mine.genome,0.070,{x:0,y:0}) ];
world[0].drive.bond=mine.bond;
if(awayFor>6*3600e3){                       // it waited, then dozed off
  const c=world[0];
  c.phase="asleep"; c.body.asleep=true; c.wakeAt=1e9; c.drive.idle=c.sleepAfter+9;
}
let greetPending=firstMeeting?false:awayFor>60e3;

function persist(){
  mine.bond=world[0]?world[0].drive.bond:mine.bond;
  mine.seen=Date.now();
  store.write(mine);
}
addEventListener("pagehide",persist);
setInterval(persist,10000);

/* A greeting is the one expression that is allowed to arrive unprompted — because the prompt is
   you coming back, which is the single best thing that happens to an Oglet all day. */
function greetUser(now,warm){
  for(const c of world){
    if(c.phase!=="awake") c.wake(now,false);
    c.setExpr("happy",warm?2.6:1.9,now);
    c.body.blinkNow(0.05); c.b.vz-=warm?3.4:2.2;
    c.drive.ignored=0; c.drive.lonely=Math.max(0,c.drive.lonely-0.6);
    c.drive.bond=clamp(c.drive.bond+0.01,0,1);
    c.attn="user"; c.attnUntil=now+rand(2.5,4.2);
  }
}
let hiddenAt=Date.now();
document.addEventListener("visibilitychange",()=>{
  if(document.hidden){ hiddenAt=Date.now(); persist(); return; }
  if(Date.now()-hiddenAt>45e3) greetPending=true;
});

const ptr={x:-1e5,y:-1e5,px:0,py:0,in:false,last:-1e9,down:false,t0:0,moved:0,seen:false};
let held=null,touched=false;
const hint=document.getElementById("hint");
hint.textContent=`${firstMeeting?"meet":"drag"} ${mine.name}`;
const seen=()=>{ if(!touched){ touched=true; hint.style.opacity=0; } };
const local=e=>{ const r=cv.getBoundingClientRect(); return {x:e.clientX-r.left,y:e.clientY-r.top}; };
/* the first move or touch after you have been away is what triggers the welcome */
const noticed=(now)=>{ ptr.seen=true; if(greetPending){ greetPending=false; greetUser(now,awayFor>6*3600e3); } };

cv.addEventListener("pointerdown",e=>{
  const p=local(e);
  ptr.x=ptr.px=p.x; ptr.y=ptr.py=p.y;
  ptr.in=true; ptr.down=true; ptr.moved=0;
  ptr.t0=performance.now()/1000; ptr.last=ptr.t0; seen(); noticed(ptr.t0);
  for(const c of world) if(c.phase!=="awake") c.wake(ptr.t0,true);
  for(let i=world.length-1;i>=0;i--){
    if(world[i].hit(p.x,p.y)){
      held=world[i]; held.dragging=true;
      held.gdx=held.b.x-(p.x-W/2); held.gdy=held.b.y-(p.y-H/2);
      document.body.classList.add("grabbing");
      world.push(world.splice(i,1)[0]); break;
    }
  }
},{passive:true});
cv.addEventListener("pointermove",e=>{
  const p=local(e);
  ptr.px=ptr.x; ptr.py=ptr.y; ptr.x=p.x; ptr.y=p.y;
  ptr.in=true; ptr.last=performance.now()/1000; seen(); noticed(ptr.last);
  if(ptr.down) ptr.moved+=Math.hypot(ptr.x-ptr.px,ptr.y-ptr.py);
},{passive:true});
function release(){
  const now=performance.now()/1000;
  if(held&&ptr.moved<12&&now-ptr.t0<0.35) held.poke(now);
  if(held) held.dragging=false;
  held=null; ptr.down=false; document.body.classList.remove("grabbing");
}
addEventListener("pointerup",release,{passive:true});
addEventListener("pointercancel",release,{passive:true});
cv.addEventListener("pointerleave",()=>{ ptr.in=false; },{passive:true});

/* ═══════════════════════════════════════════════════════════
   GENOME TAB
   ═══════════════════════════════════════════════════════════ */
const thumbs=[];                    // {canvas,ctx,body,visible}
function makeThumb(g,size){
  const c=document.createElement("canvas");
  const dp=Math.min(devicePixelRatio||1,2);
  c.width=size*dp; c.height=size*dp; c.style.width=size+"px"; c.style.height=size+"px";
  const x=c.getContext("2d"); x.setTransform(dp,0,0,dp,0,0);
  const t={canvas:c,ctx:x,body:new Body(g),size,visible:true,
           next:rand(0,4),phase:rand(0,10)};
  thumbs.push(t); return t;
}
function card(g,label,weight,size=72){
  const t=makeThumb(g,size);
  const el=document.createElement("div"); el.className="card";
  el.appendChild(t.canvas);
  const tier=tierOf(weight);
  // rarity used to be a colour; on a two-colour page it is brightness plus a count of pips
  const pips="·".repeat(TIERS.indexOf(tier)+1);
  el.insertAdjacentHTML("beforeend",
    `<div class="nm">${label}</div>
     <div class="rr ${tier.c}">${tier.name}<i>${pips}</i></div>
     <div class="pc">${(weight*100).toFixed(weight<0.05?1:0)}%</div>`);
  return el;
}
function section(host,title,sub,cards){
  const h=document.createElement("h2");
  h.innerHTML=`${title} <span>${sub}</span>`;
  host.appendChild(h);
  const grid=document.createElement("div"); grid.className="grid";
  cards.forEach(c=>grid.appendChild(c));
  host.appendChild(grid);
}
const base=(over={})=>Object.assign(randomGenome(),
  {shape:"round",pupil:"dot",palette:"lagoon",finish:"matte",
   gap:1.05,pupilSize:0.29,asymW:1.0,asymH:1.0},over);

function buildGenome(){
  const host=document.getElementById("genome");
  host.innerHTML="";

  /* yours — not a roller. There is one Oglet and it is the one you have; being able to reroll it
     on a whim is exactly what would stop it mattering. */
  const roll=document.createElement("div"); roll.className="roll";
  roll.appendChild(makeThumb(mine.genome,96).canvas);
  const meta=document.createElement("div"); meta.className="meta";
  const o=odds(mine.genome), t=tierOf(o*6);
  const since=new Date(mine.born).toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"});
  // one fact per line: the code and the alleles used to share a line and wrap mid-phrase
  meta.innerHTML=`<div class="code">${mine.name}</div>
    <div class="odds">${mine.code}<br>
    ${CATS.map(c=>geneOf(c,mine.genome[c]).name).join(" · ")}<br>
    1 in ${Math.round(1/o).toLocaleString()} · overall <span class="${t.c}">${t.name}</span><br>
    yours since ${since}</div>`;
  roll.appendChild(meta);
  host.appendChild(roll);

  section(host,"Eye shape","4 alleles",
    GENES.shape.map(s=>card(base({shape:s.id}),s.name,s.w)));
  section(host,"Pupil","4 alleles",
    GENES.pupil.map(s=>card(base({pupil:s.id}),s.name,s.w)));
  section(host,"Palette","12 alleles",
    GENES.palette.map(s=>card(base({palette:s.id}),s.name,s.w)));
  section(host,"Finish","3 alleles",
    GENES.finish.map(s=>card(base({finish:s.id,palette:"iris"}),s.name,s.w)));

  const combos=GENES.shape.length*GENES.pupil.length*GENES.palette.length*GENES.finish.length;
  host.insertAdjacentHTML("beforeend",
    `<div class="note">
      ${mine.name} is one draw from this genome, made the first time you opened this page
      and kept in this browser since.<br>
      ${combos.toLocaleString()} categorical combinations, before continuous genes.<br>
      Rarity is not a table — a trait is rare because its allele is rare.<br>
      The same weights drive inheritance once breeding exists, and recessive
      traits can hide in a common-looking parent.
    </div>`);
}

/* ── tabs ── */
const tW=document.getElementById("tabWorld"), tG=document.getElementById("tabGenome");
const vW=document.getElementById("viewWorld"), vG=document.getElementById("viewGenome");
let tab="world", built=false;
function show(which){
  tab=which;
  tW.classList.toggle("on",which==="world");
  tG.classList.toggle("on",which==="genome");
  vW.hidden=which!=="world"; vG.hidden=which!=="genome";
  if(which==="world") resize();
  if(which==="genome"&&!built){ built=true; buildGenome(); }
}
tW.onclick=()=>show("world"); tG.onclick=()=>show("genome");

/* ── loop ── */
let last=performance.now()/1000, acc=0;
function frame(t){
  t/=1000; const dt=clamp(t-last,0,1/24); last=t;

  if(tab==="world"){
    ctx.fillStyle=WELL; ctx.fillRect(0,0,W,H);
    for(const c of world) c.update(dt,t);
    separate();
    for(const c of world) c.draw(ctx,t);
    for(const c of world) c.drawZzz(ctx);
  } else {
    // catalogue runs at 30fps — 30-odd canvases don't need 60
    acc+=dt;
    if(acc>1/30){
      const d=acc; acc=0;
      for(const th of thumbs){
        if(!th.canvas.isConnected) continue;
        const r=th.canvas.getBoundingClientRect();
        if(r.bottom<-40||r.top>innerHeight+40) continue;
        const B=th.body, tt=t+th.phase;
        if(tt>th.next){                       // ambient idling
          th.next=tt+rand(1.6,4.2);
          const a=rand(0,TAU),rr=Math.pow(Math.random(),.5);
          B.S.tx=Math.cos(a)*rr*0.8; B.S.ty=Math.sin(a)*rr*0.5;
          B.glance(B.S.tx,B.S.ty);
          // a catalogue Oglet has nothing to be sad about, so it never is
          if(Math.random()<0.3) B.setExpr(pick(["happy","neutral","neutral"]),rand(1.2,2.4),tt);
          if(tt>B.exprUntil) B.expr="neutral";
        }
        B.update(d,tt);
        const x=th.ctx, s=th.size;
        x.clearRect(0,0,s,s);
        x.fillStyle=WELL; x.fillRect(0,0,s,s);
        x.save(); x.translate(s/2,s/2);
        B.draw(x, s*0.19, tt);
        x.restore();
      }
    }
  }
  requestAnimationFrame(frame);
}
setTimeout(()=>{ if(!touched) hint.style.opacity=.9; },2000);
setTimeout(()=>{ hint.style.opacity=0; },12000);
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
