<!--
  WHICH PAGE THIS IS, DECIDED BEFORE THE FIRST PAINT.

  Every view below carries `hidden`, so nothing is on screen until something says which one. That
  something used to be `ui/router.js` — but this site is native ES modules with no bundler, so the
  router does not run until forty-odd files have been fetched and parsed. Reloading on `#/genome`
  therefore painted the landing page first and swapped it out a fifth of a second later, on every
  refresh, on every tab.

  This runs synchronously in the head instead. It only unhides; it makes no decisions the router
  will not make again the same way, and the route table below is the same list as `ROUTES`.

  **It has to be an id selector to beat `.view[hidden]{display:none}`, which means it also beats
  the router hiding that same view later** — so `ui/router.js` deletes this rule the first time it
  navigates. Without that, the page you first loaded stays painted underneath every page after it.
  Hence the id below: it is how the router finds this to remove it.
-->
<script>
  ;(function () {
    var VIEWS = { home: 'viewHome', world: 'viewWorld', genome: 'viewGenome',
      gallery: 'viewGallery', hatch: 'viewHatch' }
    var raw = location.hash.replace(/^#\/?/, '').trim().toLowerCase()
    // A bare URL is the landing, always — see the `initial` note in src/main.js.
    var boot = Object.prototype.hasOwnProperty.call(VIEWS, raw) ? raw : 'home'
    document.documentElement.dataset.route = boot
    var style = document.createElement('style')
    style.id = 'bootView'
    style.textContent = '#' + VIEWS[boot] + '[hidden]{display:block}'
    document.head.appendChild(style)
  })()
</script>
<noscript><style>#viewHome[hidden]{display:block}</style></noscript>
</head>
<body data-route="home">

<header class="topbar">
  <a class="brand" href="#/" aria-label="Oglets — home">
    <svg viewBox="0 0 32 22" aria-hidden="true" focusable="false">
      <ellipse cx="11" cy="11" rx="8" ry="9.6" fill="currentColor"/>
      <ellipse cx="24" cy="11" rx="6.2" ry="8.2" fill="currentColor"/>
      <g class="brand-eye-pupil">
        <ellipse cx="12.6" cy="11" rx="2.8" ry="2.8" fill="#0b0b0d"/>
        <ellipse cx="24.9" cy="11" rx="2.3" ry="2.3" fill="#0b0b0d"/>
      </g>
    </svg>
    <span class="brand-name">Oglets</span>
  </a>
  <nav class="routes" aria-label="Pages">
    <a href="#/world" data-route="world">World</a>
    <a href="#/genome" data-route="genome">Genome</a>
    <a href="#/gallery" data-route="gallery">Gallery</a>
  </nav>
</header>

<main>

  <!-- ── HOME ─────────────────────────────────────────────
       A door, not a pitch: the name, and the way in. The O is an eye, and src/ui/home.js is the
       only thing that touches this page — it makes that eye watch you and blink. -->
  <section class="view scroller home" id="viewHome" hidden>
    <a class="back" href="https://swymble.com/labs">← Swymble Labs</a>

    <div class="home-inner">
      <h1 class="wordmark" aria-label="oglets"><svg class="eye" viewBox="-60 -58 120 116" aria-hidden="true" focusable="false"><g class="eye-lid"><ellipse class="eye-iris" rx="46" ry="53" fill="currentColor"/><ellipse class="eye-pupil" rx="15" ry="15" fill="#0b0b0d"/></g></svg><span aria-hidden="true">glets</span></h1>

      <a class="btn btn-primary enter" href="#/world" id="enterWorld">Enter</a>
      <noscript><p class="no-js">The world needs JavaScript. Nothing leaves your browser.</p></noscript>
    </div>
  </section>

  <!-- ── WORLD ──────────────────────────────────────────── -->
  <section class="view" id="viewWorld" hidden>
    <canvas id="world"></canvas>
    <div id="hint">drag it</div>
  </section>

  <!-- ── GENOME ─────────────────────────────────────────── -->
  <section class="view scroller" id="viewGenome" hidden>
    <div id="genome"></div>
  </section>

  <!-- ── HATCH ──────────────────────────────────────────────
       Reached only by a first-time visitor pressing Enter, and only until the shell breaks; after
       that `mine.hatched` is true and the route redirects to World. No nav link on purpose. -->
  <section class="view" id="viewHatch" hidden>
    <div id="hatch"></div>
  </section>

  <!-- ── GALLERY ────────────────────────────────────────── -->
  <section class="view scroller" id="viewGallery" hidden>
    <div id="gallery"></div>
  </section>

</main>

<script type="module" src="./src/main.js"></script>
</body>
</html>
