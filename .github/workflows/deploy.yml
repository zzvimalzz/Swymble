name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            src/data/subdomains/mybirth/package-lock.json
            src/data/subdomains/what2watch/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install MyBirth dependencies
        run: npm ci --prefix src/data/subdomains/mybirth

      - name: Install what2watch dependencies
        run: npm ci --prefix src/data/subdomains/what2watch

      - name: Run data-integrity tests
        run: npm test

      - name: Build site
        run: npm run build
        env:
          # Ownership-verification tokens and the IndexNow key. All three are public values that
          # end up in the deployed site, so repository *variables* are the right home for them —
          # they are not secrets. Each is optional: unset, the build simply omits that piece.
          GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
          BING_SITE_VERIFICATION: ${{ vars.BING_SITE_VERIFICATION }}
          INDEXNOW_KEY: ${{ vars.INDEXNOW_KEY }}
          # Set only once cloudflare/mcp-worker.js is deployed — it gates whether the MCP server
          # card is published at all. See docs/agent-readiness.md.
          MCP_SERVER_URL: ${{ vars.MCP_SERVER_URL }}

      # Report-only Lighthouse audit of the built pages (results land in the job log with a
      # temporary public report URL). continue-on-error keeps flaky runners from blocking deploys.
      - name: Lighthouse audit
        uses: treosh/lighthouse-ci-action@v12
        continue-on-error: true
        with:
          configPath: .lighthouserc.json
          uploadArtifacts: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # Tells Bing (and Yandex/Seznam) that these URLs changed, instead of waiting to be
      # re-crawled. Runs after the deploy so the key file it references is already live.
      # No-ops when INDEXNOW_KEY is unset, and never fails the job — the deploy has already
      # succeeded by this point and a rejected ping is not a reason to mark it red.
      - name: Checkout (for the submission script)
        if: vars.INDEXNOW_KEY != ''
        uses: actions/checkout@v4

      - name: Notify IndexNow
        if: vars.INDEXNOW_KEY != ''
        continue-on-error: true
        env:
          INDEXNOW_KEY: ${{ vars.INDEXNOW_KEY }}
        run: npm run submit:indexnow
