    <!--
      Sitewide entity graph. Everything here is stable across routes, so it lives in the HTML shell
      rather than in useRouteSeo.ts (which only owns the per-route `data-swymble-jsonld` blocks).
      The @id anchors let per-page structured data reference these nodes instead of redefining them,
      which is what lets a search engine or an assistant treat "Swymble" as one entity rather than
      as a different organisation on every page.
    -->

            "alternateName": ["Swymble", "Swymble Studio", "Swymble Labs"],
            "url": "https://swymble.com",
            "logo": {

              "url": "https://swymble.com/images/icon-512.png",

            },

            "description": "Swymble is a one-person software studio and engineering lab based in Kuala Lumpur, Malaysia. It builds websites, apps and AI systems for businesses, and runs its own experimental products under Swymble Labs.",

              }
            ]
          },
          {
            "@type": "Person",
            "@id": "https://swymble.com/#person",
            "name": "Vimal",
            "jobTitle": "Software Engineer",
            "description": "Software engineer working on backend systems, APIs and AI platforms, with production experience on enterprise fintech platforms. Founder of Swymble.",
            "url": "https://swymble.com/about",
            "worksFor": { "@id": "https://swymble.com/#organization" },
            "sameAs": ["https://github.com/zzvimalzz"],
            "knowsAbout": [

            ],

    <title>SWYMBLE | Software Studio, Projects & Experiments</title>

    <script>
      (function (location) {
        var hostname = location.hostname.toLowerCase();
        var hostLabels = hostname.split('.').filter(Boolean);

        // `www` is not a subdomain app. Without this guard the block below rewrote
        // https://www.swymble.com/ to /subdomains/www/index.html, which does not exist — every
        // www visit (and every crawl of a www link) landed on the 404 handler instead of the
        // site. Send it to the canonical apex host instead, preserving the path.
        if (hostname === 'www.swymble.com') {
          location.replace(
            'https://swymble.com' + location.pathname + location.search + location.hash,
          );
          return;
        }

        var localhostSubdomain =
          hostLabels.length > 1 && hostLabels[hostLabels.length - 1] === 'localhost'
            ? hostLabels[0]
            : null;
        var swymbleSubdomain =
          hostLabels.length > 2 && hostname.endsWith('.swymble.com') && hostLabels[0] !== 'www'
            ? hostLabels[0]
            : null;
        var activeSubdomain = localhostSubdomain || swymbleSubdomain;

        if (activeSubdomain && !location.pathname.startsWith('/subdomains/')) {
          var resolvedPath =
            location.pathname === '/' || location.pathname === '/index.html'
              ? '/index.html'
              : location.pathname;

          location.replace(
            '/subdomains/' +
              encodeURIComponent(activeSubdomain) +
              resolvedPath +
              location.search +
              location.hash,
          );
          return;
        }

        if (location.search[1] === '/') {
          var decodedPath = location.search
            .slice(1)
            .split('&')
            .map(function (part) {
              return part.replace(/~and~/g, '&');
            })
            .join('?');

          window.history.replaceState(null, '', decodedPath + location.hash);
        }
      })(window.location);
    </script>
